<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="35%" stop-color="#f59e0b"/>
      <stop offset="70%" stop-color="#d97706"/>
      <stop offset="100%" stop-color="#92400e"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Luxury Obsidian Squircle Base -->
  <rect x="2" y="2" width="60" height="60" rx="16" fill="#09090b" />
  <rect x="3" y="3" width="58" height="58" rx="15" fill="none" stroke="url(#goldGrad)" stroke-width="1.5" stroke-opacity="0.6" />

  <!-- Sparkling 8-Pointed Golden Étoile Star -->
  <g filter="url(#glow)">
    <path d="M32 10 L34.8 22.5 L46 18 L38 27 L49.5 32 L38 37 L46 46 L34.8 41.5 L32 54 L29.2 41.5 L18 46 L26 37 L14.5 32 L26 27 L18 18 L29.2 22.5 Z" fill="url(#goldGrad)" />
  </g>

  <!-- Central Fine Dining Crown / Monogram Center -->
  <circle cx="32" cy="32" r="4.5" fill="#09090b" stroke="url(#goldGrad)" stroke-width="1.2" />
  <circle cx="32" cy="32" r="1.8" fill="#fef08a" />
</svg>
